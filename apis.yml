aid: chalk
name: Chalk
description: >-
  Chalk is a real-time AI/ML data platform ("Context Engine") that lets teams define features,
  embeddings, LLM outputs, and prompts once in Python and serve them everywhere — training,
  real-time inference, and agents — computed on infrastructure the customer controls. Instead of
  stitching together a feature store, vector database, retrieval and prompt tooling, orchestration,
  and a sandbox runtime, Chalk unifies them: features are point-in-time correct, served in
  single-digit milliseconds, and deployed via a branch-based model inside the customer's own cloud.
  It exposes a REST API and gRPC client libraries (Python, TypeScript, Go, Java, C#), a first-party
  CLI, OAuth 2.0 authentication, and MCP-scoped agent access. Backed by Felicis and General Catalyst.
